services:
  # ---------- Shared infrastructure ----------
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kapyo-net

  # ---------- Kapyo SaaS (Angular + FastAPI + Postgres) ----------
  kapyo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${KAPYO_DB_USER:-kapyo}
      POSTGRES_PASSWORD: ${KAPYO_DB_PASSWORD:-kapyo}
      POSTGRES_DB: ${KAPYO_DB_NAME:-kapyo}
    volumes:
      - kapyo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KAPYO_DB_USER:-kapyo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kapyo-net

  kapyo-backend:
    build: ./kapyo-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${KAPYO_DB_USER:-kapyo}:${KAPYO_DB_PASSWORD:-kapyo}@kapyo-db:5432/${KAPYO_DB_NAME:-kapyo}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE}
      AUTH0_ALGORITHMS: RS256
      CORS_ORIGINS: ${CORS_ORIGINS:-http://kapyo.localhost,http://shop-a.localhost,http://shop-b.localhost}
      SITE_A_KEY: ${SITE_A_KEY:-site-a-secret}
      SITE_B_KEY: ${SITE_B_KEY:-site-b-secret}
      SITE_C_KEY: ${SITE_C_KEY:-}
      SHOP_A_PLATFORM: ${SHOP_A_PLATFORM:-woocommerce}
      SHOP_B_PLATFORM: ${SHOP_B_PLATFORM:-woocommerce}
      SHOP_C_PLATFORM: ${SHOP_C_PLATFORM:-shopify}
      SHOP_A_WC_URL: http://shop-a
      SHOP_A_WC_HOST: shop-a.localhost
      SHOP_A_WC_CONSUMER_KEY: ${SHOP_A_WC_CONSUMER_KEY:-ck_kapyo_shop-a}
      SHOP_A_WC_CONSUMER_SECRET: ${SHOP_A_WC_CONSUMER_SECRET:-cs_kapyo_shop-a_secret}
      SHOP_B_WC_URL: http://shop-b
      SHOP_B_WC_HOST: shop-b.localhost
      SHOP_B_WC_CONSUMER_KEY: ${SHOP_B_WC_CONSUMER_KEY:-ck_kapyo_shop-b}
      SHOP_B_WC_CONSUMER_SECRET: ${SHOP_B_WC_CONSUMER_SECRET:-cs_kapyo_shop-b_secret}
      # Shopify target (site-c). Inactive until SHOP_C_SHOPIFY_DOMAIN is set.
      SHOP_C_HOST: ${SHOP_C_HOST:-}
      SHOP_C_SHOPIFY_DOMAIN: ${SHOP_C_SHOPIFY_DOMAIN:-}
      SHOP_C_SHOPIFY_ADMIN_TOKEN: ${SHOP_C_SHOPIFY_ADMIN_TOKEN:-}
      SHOP_C_SHOPIFY_STOREFRONT_TOKEN: ${SHOP_C_SHOPIFY_STOREFRONT_TOKEN:-}
      SHOP_C_SHOPIFY_API_VERSION: ${SHOP_C_SHOPIFY_API_VERSION:-2024-10}
      SHOP_C_SHOPIFY_WEBHOOK_SECRET: ${SHOP_C_SHOPIFY_WEBHOOK_SECRET:-}
      B2B_EMAILS: ${B2B_EMAILS:-}
      CART_TTL_SECONDS: ${CART_TTL_SECONDS:-604800}
      ACTIVE_PRODUCTS_RECONCILE_SECONDS: ${ACTIVE_PRODUCTS_RECONCILE_SECONDS:-3600}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      kapyo-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.kapyo-api.rule=Host(`api.kapyo.localhost`)
      - traefik.http.services.kapyo-api.loadbalancer.server.port=8000
    networks:
      - kapyo-net

  kapyo-frontend:
    build:
      context: ./kapyo-frontend
      args:
        AUTH0_DOMAIN: ${AUTH0_DOMAIN}
        AUTH0_CLIENT_ID: ${AUTH0_SPA_CLIENT_ID}
        AUTH0_AUDIENCE: ${AUTH0_API_AUDIENCE}
        API_URL: http://api.kapyo.localhost
    labels:
      - traefik.enable=true
      - traefik.http.routers.kapyo-web.rule=Host(`kapyo.localhost`)
      - traefik.http.services.kapyo-web.loadbalancer.server.port=80
    networks:
      - kapyo-net

  # ---------- WordPress Site A ----------
  shop-a-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - shop-a-db-data:/var/lib/mysql
    networks:
      - kapyo-net

  shop-a:
    image: wordpress:6.8-php8.3-apache
    environment:
      WORDPRESS_DB_HOST: shop-a-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('KAPYO_API_URL', 'http://api.kapyo.localhost');
        define('KAPYO_SITE_ID', 'site-a');
        define('KAPYO_SITE_KEY', '${SITE_A_KEY:-site-a-secret}');
        define('KAPYO_AUTH0_DOMAIN', '${AUTH0_DOMAIN}');
        define('KAPYO_AUTH0_CLIENT_ID', '${AUTH0_SPA_CLIENT_ID}');
        define('KAPYO_AUTH0_AUDIENCE', '${AUTH0_API_AUDIENCE}');
    volumes:
      - shop-a-data:/var/www/html
      - ./wordpress/plugins/kapyo-cart:/var/www/html/wp-content/plugins/kapyo-cart
      - ./wordpress/mu-plugins/site-a:/var/www/html/wp-content/mu-plugins
    depends_on:
      - shop-a-db
    labels:
      - traefik.enable=true
      - traefik.http.routers.shop-a.rule=Host(`shop-a.localhost`)
      - traefik.http.services.shop-a.loadbalancer.server.port=80
    networks:
      - kapyo-net

  shop-a-init:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - shop-a
    environment:
      WORDPRESS_DB_HOST: shop-a-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      KAPYO_WC_CONSUMER_KEY: ${SHOP_A_WC_CONSUMER_KEY:-ck_kapyo_shop-a}
      KAPYO_WC_CONSUMER_SECRET: ${SHOP_A_WC_CONSUMER_SECRET:-cs_kapyo_shop-a_secret}
    volumes:
      - shop-a-data:/var/www/html
      - ./wordpress/plugins/kapyo-cart:/var/www/html/wp-content/plugins/kapyo-cart
      - ./wordpress/init:/init
    entrypoint: ["/bin/sh", "/init/setup.sh"]
    command: ["shop-a", "Maison Lumière", "#db2777", "fashion-a"]
    networks:
      - kapyo-net

  # ---------- WordPress Site B ----------
  shop-b-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - shop-b-db-data:/var/lib/mysql
    networks:
      - kapyo-net

  shop-b:
    image: wordpress:6.8-php8.3-apache
    environment:
      WORDPRESS_DB_HOST: shop-b-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('KAPYO_API_URL', 'http://api.kapyo.localhost');
        define('KAPYO_SITE_ID', 'site-b');
        define('KAPYO_SITE_KEY', '${SITE_B_KEY:-site-b-secret}');
        define('KAPYO_AUTH0_DOMAIN', '${AUTH0_DOMAIN}');
        define('KAPYO_AUTH0_CLIENT_ID', '${AUTH0_SPA_CLIENT_ID}');
        define('KAPYO_AUTH0_AUDIENCE', '${AUTH0_API_AUDIENCE}');
    volumes:
      - shop-b-data:/var/www/html
      - ./wordpress/plugins/kapyo-cart:/var/www/html/wp-content/plugins/kapyo-cart
      - ./wordpress/mu-plugins/site-b:/var/www/html/wp-content/mu-plugins
    depends_on:
      - shop-b-db
    labels:
      - traefik.enable=true
      - traefik.http.routers.shop-b.rule=Host(`shop-b.localhost`)
      - traefik.http.services.shop-b.loadbalancer.server.port=80
    networks:
      - kapyo-net

  shop-b-init:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - shop-b
    environment:
      WORDPRESS_DB_HOST: shop-b-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      KAPYO_WC_CONSUMER_KEY: ${SHOP_B_WC_CONSUMER_KEY:-ck_kapyo_shop-b}
      KAPYO_WC_CONSUMER_SECRET: ${SHOP_B_WC_CONSUMER_SECRET:-cs_kapyo_shop-b_secret}
    volumes:
      - shop-b-data:/var/www/html
      - ./wordpress/plugins/kapyo-cart:/var/www/html/wp-content/plugins/kapyo-cart
      - ./wordpress/init:/init
    entrypoint: ["/bin/sh", "/init/setup.sh"]
    command: ["shop-b", "Urban Drop", "#7c3aed", "fashion-b"]
    networks:
      - kapyo-net

volumes:
  kapyo-db-data:
  shop-a-data:
  shop-a-db-data:
  shop-b-data:
  shop-b-db-data:

networks:
  kapyo-net:
    driver: bridge
