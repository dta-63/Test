services:
  # ---------- Shared infrastructure ----------
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pimp-net

  # ---------- Pimp SaaS (Angular + FastAPI + Postgres) ----------
  pimp-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PIMP_DB_USER:-pimp}
      POSTGRES_PASSWORD: ${PIMP_DB_PASSWORD:-pimp}
      POSTGRES_DB: ${PIMP_DB_NAME:-pimp}
    volumes:
      - pimp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PIMP_DB_USER:-pimp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pimp-net

  pimp-backend:
    build: ./pimp-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${PIMP_DB_USER:-pimp}:${PIMP_DB_PASSWORD:-pimp}@pimp-db:5432/${PIMP_DB_NAME:-pimp}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE}
      AUTH0_ALGORITHMS: RS256
      CORS_ORIGINS: ${CORS_ORIGINS:-http://pimp.localhost,http://shop-a.localhost,http://shop-b.localhost}
      SITE_A_KEY: ${SITE_A_KEY:-site-a-secret}
      SITE_B_KEY: ${SITE_B_KEY:-site-b-secret}
      SHOP_A_WC_URL: http://shop-a
      SHOP_A_WC_HOST: shop-a.localhost
      SHOP_A_WC_CONSUMER_KEY: ${SHOP_A_WC_CONSUMER_KEY:-ck_pimp_shop-a}
      SHOP_A_WC_CONSUMER_SECRET: ${SHOP_A_WC_CONSUMER_SECRET:-cs_pimp_shop-a_secret}
      SHOP_B_WC_URL: http://shop-b
      SHOP_B_WC_HOST: shop-b.localhost
      SHOP_B_WC_CONSUMER_KEY: ${SHOP_B_WC_CONSUMER_KEY:-ck_pimp_shop-b}
      SHOP_B_WC_CONSUMER_SECRET: ${SHOP_B_WC_CONSUMER_SECRET:-cs_pimp_shop-b_secret}
      B2B_EMAILS: ${B2B_EMAILS:-}
      CART_TTL_SECONDS: ${CART_TTL_SECONDS:-604800}
      ACTIVE_PRODUCTS_RECONCILE_SECONDS: ${ACTIVE_PRODUCTS_RECONCILE_SECONDS:-3600}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      pimp-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.pimp-api.rule=Host(`api.pimp.localhost`)
      - traefik.http.services.pimp-api.loadbalancer.server.port=8000
    networks:
      - pimp-net

  pimp-frontend:
    build:
      context: ./pimp-frontend
      args:
        AUTH0_DOMAIN: ${AUTH0_DOMAIN}
        AUTH0_CLIENT_ID: ${AUTH0_SPA_CLIENT_ID}
        AUTH0_AUDIENCE: ${AUTH0_API_AUDIENCE}
        API_URL: http://api.pimp.localhost
    labels:
      - traefik.enable=true
      - traefik.http.routers.pimp-web.rule=Host(`pimp.localhost`)
      - traefik.http.services.pimp-web.loadbalancer.server.port=80
    networks:
      - pimp-net

  # ---------- WordPress Site A ----------
  shop-a-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - shop-a-db-data:/var/lib/mysql
    networks:
      - pimp-net

  shop-a:
    image: wordpress:6.8-php8.3-apache
    environment:
      WORDPRESS_DB_HOST: shop-a-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('PIMP_API_URL', 'http://api.pimp.localhost');
        define('PIMP_SITE_ID', 'site-a');
        define('PIMP_SITE_KEY', '${SITE_A_KEY:-site-a-secret}');
        define('PIMP_AUTH0_DOMAIN', '${AUTH0_DOMAIN}');
        define('PIMP_AUTH0_CLIENT_ID', '${AUTH0_SPA_CLIENT_ID}');
        define('PIMP_AUTH0_AUDIENCE', '${AUTH0_API_AUDIENCE}');
    volumes:
      - shop-a-data:/var/www/html
      - ./wordpress/plugins/pimp-cart:/var/www/html/wp-content/plugins/pimp-cart
      - ./wordpress/mu-plugins/site-a:/var/www/html/wp-content/mu-plugins
    depends_on:
      - shop-a-db
    labels:
      - traefik.enable=true
      - traefik.http.routers.shop-a.rule=Host(`shop-a.localhost`)
      - traefik.http.services.shop-a.loadbalancer.server.port=80
    networks:
      - pimp-net

  shop-a-init:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - shop-a
    environment:
      WORDPRESS_DB_HOST: shop-a-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      PIMP_WC_CONSUMER_KEY: ${SHOP_A_WC_CONSUMER_KEY:-ck_pimp_shop-a}
      PIMP_WC_CONSUMER_SECRET: ${SHOP_A_WC_CONSUMER_SECRET:-cs_pimp_shop-a_secret}
    volumes:
      - shop-a-data:/var/www/html
      - ./wordpress/plugins/pimp-cart:/var/www/html/wp-content/plugins/pimp-cart
      - ./wordpress/init:/init
    entrypoint: ["/bin/sh", "/init/setup.sh"]
    command: ["shop-a", "Shop A - Electronics", "#1e3a8a", "electronics"]
    networks:
      - pimp-net

  # ---------- WordPress Site B ----------
  shop-b-db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - shop-b-db-data:/var/lib/mysql
    networks:
      - pimp-net

  shop-b:
    image: wordpress:6.8-php8.3-apache
    environment:
      WORDPRESS_DB_HOST: shop-b-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('PIMP_API_URL', 'http://api.pimp.localhost');
        define('PIMP_SITE_ID', 'site-b');
        define('PIMP_SITE_KEY', '${SITE_B_KEY:-site-b-secret}');
        define('PIMP_AUTH0_DOMAIN', '${AUTH0_DOMAIN}');
        define('PIMP_AUTH0_CLIENT_ID', '${AUTH0_SPA_CLIENT_ID}');
        define('PIMP_AUTH0_AUDIENCE', '${AUTH0_API_AUDIENCE}');
    volumes:
      - shop-b-data:/var/www/html
      - ./wordpress/plugins/pimp-cart:/var/www/html/wp-content/plugins/pimp-cart
      - ./wordpress/mu-plugins/site-b:/var/www/html/wp-content/mu-plugins
    depends_on:
      - shop-b-db
    labels:
      - traefik.enable=true
      - traefik.http.routers.shop-b.rule=Host(`shop-b.localhost`)
      - traefik.http.services.shop-b.loadbalancer.server.port=80
    networks:
      - pimp-net

  shop-b-init:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - shop-b
    environment:
      WORDPRESS_DB_HOST: shop-b-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      PIMP_WC_CONSUMER_KEY: ${SHOP_B_WC_CONSUMER_KEY:-ck_pimp_shop-b}
      PIMP_WC_CONSUMER_SECRET: ${SHOP_B_WC_CONSUMER_SECRET:-cs_pimp_shop-b_secret}
    volumes:
      - shop-b-data:/var/www/html
      - ./wordpress/plugins/pimp-cart:/var/www/html/wp-content/plugins/pimp-cart
      - ./wordpress/init:/init
    entrypoint: ["/bin/sh", "/init/setup.sh"]
    command: ["shop-b", "Shop B - Fashion", "#be185d", "fashion"]
    networks:
      - pimp-net

volumes:
  pimp-db-data:
  shop-a-data:
  shop-a-db-data:
  shop-b-data:
  shop-b-db-data:

networks:
  pimp-net:
    driver: bridge
